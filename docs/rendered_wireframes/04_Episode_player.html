<html lang="en"><head>

<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f1f1c}
.b{border:1.5px solid #6b6b66;border-radius:8px;background:#fff;padding:10px;box-sizing:border-box}
.h{font-weight:700;font-size:14px}
.t{font-size:11px;color:#55554f;margin-top:4px}
.btn{border:1.5px solid #1f1f1c;border-radius:8px;background:#1f1f1c;color:#fff;padding:10px 14px;font-size:14px;font-family:inherit}
.ghost{border:1.5px solid #1f1f1c;border-radius:8px;background:#fff;color:#1f1f1c;padding:8px 12px;font-size:13px;font-family:inherit}
.ln{height:8px;background:#d8d8d0;border-radius:4px;margin:7px 0}
.chip{display:inline-block;border:1.5px solid #6b6b66;border-radius:12px;padding:2px 8px;font-size:11px;background:#f1f1ec}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#f4f4f0;padding:24px;display:flex;flex-direction:column;gap:14px;overflow:hidden">

<div style="display:flex;justify-content:space-between"><span class="chip">Back</span><span class="chip">Report error</span></div>
<div class="h" style="font-size:18px">Episode title [E2 of 5]</div>
<div class="b" style="font-size:11px;background:#f1f1ec">Trust label: reviewed by [name], [board], [year], verified [date]. AI-assisted. FR-CUR-06</div>
<div class="b" style="height:200px;display:flex;align-items:center;justify-content:center;background:#e4e4de">Video or audio player. Captions, speed, resume</div>
<div style="display:flex;gap:8px"><span class="chip">Transcript</span><span class="chip">Notes</span><span class="chip">Glossary</span></div>
<div class="b" style="flex:1"><div class="ln"></div><div class="ln"></div><div class="ln" style="width:80%"></div><div class="ln"></div><div class="ln" style="width:55%"></div><div class="h" style="margin-top:12px">Quick recap</div><div class="ln"></div><div class="ln" style="width:65%"></div></div>
<div style="display:flex;gap:8px"><button type="button" class="ghost" style="flex:1">Ask a doubt</button><button type="button" class="ghost" style="flex:1">Bookmark</button></div>
<button type="button" class="btn" style="padding:14px">Take checkpoint (next episode locked)</button>
<div class="t">FR-STU-04, FR-AST-02, FR-ACC-01</div>
</div>
</x-dc>
